[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quarterly-valuation-engine"
version = "0.4.0"
description = "Point-in-time NVIDIA fundamental valuation research engine"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "typer>=0.15,<1",
  "httpx>=0.28,<1",
  "pandas>=2.2,<4",
  "pandas-market-calendars>=5,<6",
  "beautifulsoup4>=4.13,<5",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=5,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-beautifulsoup4", "pandas-stubs"]

[project.scripts]
qve = "valuation_engine.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/valuation_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
