name: stockos
services:
  app:
    image: ${STOCKOS_IMAGE:?Set the tested StockOS image digest}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 1
    stop_grace_period: 45s
    environment:
      STOCKOS_PUBLIC_ORIGIN: https://${STOCKOS_DOMAIN:?Set your HTTPS hostname}
      STOCKOS_DEPLOYMENT: cloud
      SEC_USER_AGENT: ${SEC_USER_AGENT:?Set the SEC download project name and contact email}
    volumes:
      - type: bind
        source: ${STOCKOS_SEED_DIR:?Set the verified seed directory}
        target: /seed
        read_only: true
        bind:
          create_host_path: false
      - research:/state
    tmpfs: [/tmp:size=64m,mode=1777]
    # No host port. Only the authenticated proxy can reach this private backend.
    networks: [backend]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  gateway:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    init: true
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    pids_limit: 64
    mem_limit: 256m
    ports: ["80:80", "443:443"]
    environment:
      STOCKOS_DOMAIN: ${STOCKOS_DOMAIN:?Set your HTTPS hostname}
      STOCKOS_USER: ${STOCKOS_USER:?Set a login username}
      STOCKOS_PASSWORD_HASH: ${STOCKOS_PASSWORD_HASH:?Set a Caddy password hash}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls:/data
      - caddy_config:/config
    tmpfs: [/tmp:size=16m,mode=1777]
    networks: [backend]
    depends_on:
      app: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
volumes:
  research:
  tls:
  caddy_config:
networks:
  backend:
